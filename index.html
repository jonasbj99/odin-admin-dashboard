<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Odin Admin Dashboard | JBJ</title>
    <link rel="stylesheet" href="./styles.css" />
    <script
      src="https://kit.fontawesome.com/e639c0bb0f.js"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <nav class="sidebar">
      <div class="logo">
        <img src="./img/jbj-logo.svg" alt="Site logo" height="50" />
        Dashboard
      </div>
      <ul class="nav-group">
        <li>
          <a href="#">
            <i class="fa-solid fa-house"></i>
            Home
          </a>
        </li>
        <li>
          <a href="#">
            <i class="fa-solid fa-address-card"></i>
            Profile
          </a>
        </li>
        <li>
          <a href="#">
            <i class="fa-solid fa-message"></i>
            Messages
          </a>
        </li>
        <li>
          <a href="#">
            <i class="fa-solid fa-clock-rotate-left"></i>
            History
          </a>
        </li>
        <li>
          <a href="#">
            <i class="fa-solid fa-table-list"></i>
            Tasks
          </a>
        </li>
        <li>
          <a href="#">
            <i class="fa-solid fa-users"></i>
            Communities
          </a>
        </li>
      </ul>

      <ul class="nav-group">
        <li>
          <a href="#">
            <i class="fa-solid fa-gear"></i>
            Settings
          </a>
        </li>
        <li>
          <a href="#">
            <i class="fa-solid fa-circle-question"></i>
            Support
          </a>
        </li>
        <li>
          <a href="#">
            <i class="fa-solid fa-shield-halved"></i>
            Privacy
          </a>
        </li>
      </ul>
    </nav>

    <header class="header">
      <div class="search-bar">
        <button class="small-btn">
          <i class="fa-solid fa-magnifying-glass"></i>
        </button>
        <input type="search" />
      </div>
      <div class="settings">
        <button class="small-btn"><i class="fa-solid fa-bell"></i></button>
        <img src="./img/jbj-logo.svg" alt="Profile picture" width="40px" />
        <p>Morgan Oakley</p>
      </div>
      <div class="profile">
        <img src="./img/jbj-logo.svg" alt="Profile picture" width="40px" />
        <div>
          <p>Hi there,</p>
          <p class="username">Morgan Oakley &lpar;@morgan&rpar;</p>
        </div>
      </div>
      <div class="post-btns">
        <button>New</button>
        <button>Upload</button>
        <button>Share</button>
      </div>
    </header>

    <main class="main">
      <div class="projects">
        <h2 class="section-title">Your Projects</h2>
      </div>
      <div class="announcements">
        <h2 class="section-title">Announcements</h2>
      </div>
      <div class="trending">
        <h2 class="section-title">Trending</h2>
      </div>
    </main>
  </body>
</html>
